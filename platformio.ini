; Aadhar firmware (ESP32 DevKit on COM6)
;
; Build & upload from this folder:   pio run -t upload
; Serial monitor:                    pio device monitor
;
; This board doesn't enter download mode by itself. Before uploading:
; unplug USB, hold BOOT, plug USB back in, release BOOT.

[platformio]
src_dir = Aadhar

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
board_upload.before_reset = no_reset
